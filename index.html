<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMPIRE 👑 - Loja Oficial</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#0a0a0a;color:#fff;padding-bottom:80px}
.topo{position:sticky;top:0;background:#111;padding:12px 15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222;z-index:99}
.topo .logo{font-weight:900;font-size:20px;letter-spacing:2px}
.topo .logo span{color:#d4af37}
.iconBtn{background:#1a1a1a;border:1px solid #333;width:40px;height:40px;border-radius:12px;color:#fff;font-size:18px;cursor:pointer}
.saudacao{padding:20px 15px 10px}
.saudacao h1{font-size:26px;line-height:1.2}
.saudacao p{color:#888;font-size:13px;margin-top:4px}
.pesquisaBox{margin:0 15px;background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center}
.pesquisaBox input{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:15px}
.acoes{ display:flex;gap:8px;overflow:auto;padding:15px; }
.acoes button{background:#1a1a1a;border:1px solid #333;color:#fff;padding:10px 16px;border-radius:30px;white-space:nowrap;cursor:pointer;font-weight:700}
.acoes button.ativo{background:#d4af37;color:#000;border-color:#d4af37}
.secao{margin:5px 15px 15px;background:#111;border:1px solid #222;border-radius:16px;padding:15px}
.secaoTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.secaoTop b{font-size:16px}
.secaoTop a{color:#00aaff;font-size:13px;text-decoration:none}
.barraBaixo{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0;z-index:99}
.barraBaixo button{background:none;border:0;color:#aaa;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.barraBaixo button.ativo{color:#d4af37}
.barraBaixo span{font-size:22px}
#produtos, #produtosDestaque{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#1a1a1a;border-radius:14px;overflow:hidden;border:1px solid #222}
.card img{width:100%;height:130px;object-fit:cover}
.card .info{padding:10px}
.card h3{font-size:13px}
.card .preco{color:#d4af37;font-weight:900;margin:6px 0}
.card button{width:100%;background:#d4af37;border:0;padding:9px;border-radius:10px;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<!-- TOPO IGUAL AO GITHUB -->
<div class="topo">
  <button class="iconBtn" onclick="mostrarLoja()">☰</button>
  <div class="logo" id="logoTexto">EMPIRE<span>👑</span></div>
  <div style="flex:1"></div>
  <button class="iconBtn" onclick="document.getElementById('pesquisa').focus()">🔍</button>
  <button class="iconBtn" onclick="verCarrinho()">🛒 <span id="cartCountTop">0</span></button>
  <button class="iconBtn" onclick="abrirLoginCliente()">👤</button>
</div>

<!-- SAUDAÇÃO IGUAL AO GITHUB -->
<div class="saudacao">
  <h1 id="saudacaoTexto">Boa noite,<br>Visitante!</h1>
  <p id="emailClienteTop">Cria conta para comprar 👑</p>
  <div id="areaClienteHeader" style="margin-top:10px"></div>
</div>

<!-- PESQUISA GRANDE -->
<div class="pesquisaBox">
  <span>🔍</span>
  <input id="pesquisa" placeholder="Pesquisa produto... ex: Perfume, Ténis" oninput="filtrar()">
  <span onclick="filtrar()" style="cursor:pointer">➤</span>
</div>

<!-- BOTÕES RÁPIDOS -->
<div class="acoes">
  <button class="ativo" onclick="setFiltro('todos',this)">🏠 Todos</button>
  <button onclick="setFiltro('perfume',this)">🌸 Perfumes</button>
  <button onclick="setFiltro('tenis',this)">👟 Ténis</button>
  <button onclick="setFiltro('roupa',this)">👕 Roupas</button>
  <button onclick="setFiltro('acessorio',this)">⌚ Acessórios</button>
  <button onclick="mostrarAdmin()">⚙️ Painel</button>
</div>

<!-- SECÇÃO DESTAQUES -->
<div class="secao" id="areaDestaque">
  <div class="secaoTop"><b>⭐ Produtos em Destaque</b><a href="#" onclick="setFiltro('todos',this);return false">Ver tudo</a></div>
  <div id="produtosDestaque"></div>
</div>

<!-- SECÇÃO TODOS -->
<div class="secao">
  <div class="secaoTop"><b>🛍️ Todos os Produtos</b><span id="qtdMostra" style="color:#888;font-size:12px"></span></div>
  <div id="produtos"></div>
  <p id="status" style="color:#888;font-size:12px;margin-top:10px;text-align:center"></p>
</div>

<!-- SECÇÃO SOBRE -->
<div class="secao">
  <div class="secaoTop"><b>👑 Sobre a EMPIRE</b></div>
  <p id="sobreTexto" style="color:#aaa;font-size:13px;line-height:1.5"></p>
  <p id="sobreExtra" style="color:#d4af37;font-size:12px;margin-top:8px"></p>
</div>

<!-- BARRA EM BAIXO IGUAL AO GITHUB -->
<div class="barraBaixo">
  <button class="ativo" onclick="mostrarLoja()"><span>🏠</span>Loja</button>
  <button onclick="verCarrinho()"><span>🛒</span>Carrinho</button>
  <button onclick="abrirLoginCliente()"><span>👤</span>Conta</button>
</div>

<!-- AQUI MANTÉM O RESTO DO TEU index.html ANTIGO -->
<!-- O adminPanel, loginBox, clienteModal, cartModal, pagModal, imgModal, etc. -->
<!-- Cola eles aqui em baixo sem apagar, para o script.js continuar a funcionar! -->

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
